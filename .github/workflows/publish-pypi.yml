name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-pypi:
    name: Build & Publish feraterra-sdk via PyPI OIDC Trusted Publisher
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Verify public SDK & MCP self-tests before packaging
        run: |
          python -B sdk/python/arena_sdk.py --self-test
          PYTHONPATH=sdk/python python -B sdk/python/feraterra_sdk.py --self-test
          python -B scripts/arena_mcp_server.py --self-test

      - name: Install PEP 517 build tool
        run: python -m pip install --upgrade pip build

      - name: Build wheel (.whl) and source distribution (.tar.gz)
        run: python -m build

      - name: Publish distribution to PyPI (OIDC Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
