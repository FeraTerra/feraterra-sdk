name: Public SDK & MCP CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sdk-and-mcp:
    name: Python 3.12 SDK/MCP & C++23 Header Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run arena_sdk.py deterministic self-test
        run: python -B sdk/python/arena_sdk.py --self-test

      - name: Run feraterra_sdk.py deterministic self-test
        run: PYTHONPATH=sdk/python python -B sdk/python/feraterra_sdk.py --self-test

      - name: Run arena_mcp_server.py MCP self-test
        run: python -B scripts/arena_mcp_server.py --self-test

      - name: Run starter bot & preview self-tests
        run: |
          python -B examples/quickstart_ccxt_and_preview.py --self-test
          python -B examples/algo_two_sided_quoter.py --self-test
          python -B examples/ai_agent_zero_capital_scanner.py --self-test

      - name: Verify C++23 header-only HFT wire & client syntax
        run: g++ -std=c++23 -fsyntax-only -Iinclude include/arena_hft_client.hpp

      - name: Verify CMake C++23 header-only targets (feraterra::wire & feraterra::hft_client)
        run: |
          mkdir -p /tmp/feraterra-cmake-smoke
          cat << 'EOF' > /tmp/feraterra-cmake-smoke/CMakeLists.txt
          cmake_minimum_required(VERSION 3.20)
          project(feraterra_ci_smoke LANGUAGES CXX)
          add_subdirectory("${GITHUB_WORKSPACE}" feraterra_sdk)
          add_executable(hft_smoke smoke.cpp)
          target_compile_options(hft_smoke PRIVATE -Wall -Wextra -Werror)
          target_link_libraries(hft_smoke PRIVATE feraterra::wire feraterra::hft_client)
          EOF
          cat << 'EOF' > /tmp/feraterra-cmake-smoke/smoke.cpp
          #include "arena_hft_client.hpp"
          static_assert(sizeof(arena::wire::ArenaWireFrame) == 64);
          int main() {
              arena::sdk::ArenaHftWireClient client(1U);
              return client.has_ambiguous_disconnect() ? 1 : 0;
          }
          EOF
          cmake -S /tmp/feraterra-cmake-smoke -B /tmp/feraterra-cmake-smoke/build -DCMAKE_CXX_COMPILER=g++
          cmake --build /tmp/feraterra-cmake-smoke/build
          /tmp/feraterra-cmake-smoke/build/hft_smoke

      - name: Verify Rust no_std feraterra-wire codec & golden vectors
        run: cargo test --manifest-path crates/feraterra-wire/Cargo.toml
